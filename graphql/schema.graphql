scalar Date

type Mutation {
  createPerson(input: CreatePersonInput!): Person!
  updatePerson(personID: ID!, input: UpdatePersonInput!): Person!
  createSchool(input: CreateSchoolInput!): School!
  updateSchool(schoolID: ID!, input: UpdateSchoolInput!): School!
  # Generic exchange (low-level)
  createExchange(input: CreateExchangeInput!): Exchange!
  updateExchange(exchangeID: ID!, input: UpdateExchangeInput!): Exchange!
  deleteExchange(exchangeID: ID!): Boolean!
  # Type-specific exchange mutations
  createClean(matchID: ID!, scorerID: ID, receiverID: ID, attack: AttackInput, score: Float, exchangeTime: Int): Clean!
  createAfterBlow(matchID: ID!, scorerID: ID, receiverID: ID, attack: AttackInput, score: Float, exchangeTime: Int): Afterblow!
  createDouble(matchID: ID!, attack: AttackInput, exchangeTime: Int): Double!
  createDoubleOut(matchID: ID!, attack: AttackInput, exchangeTime: Int): DoubleOut!
  createWin(matchID: ID!, winnerID: ID!, exchangeTime: Int): Win!
  createTie(matchID: ID!, exchangeTime: Int): Tie!
  createNoExchange(matchID: ID!, exchangeTime: Int): NoExchange!
  createNoQuality(matchID: ID!, recipientID: ID, exchangeTime: Int): NoQuality!
  createPenalty(matchID: ID!, recipientID: ID!, illegalAction: IllegalAction!, card: Card!, score: Float, exchangeTime: Int): Penalty!
  createSwitchFighter(matchID: ID!, incomingID: ID!, outgoingID: ID!, exchangeTime: Int): SwitchFighter!
}

input CreatePersonInput {
  firstName:    String!
  lastName:     String!
  middleName:   String
  nickname:     String
  gender:       String
  birthdate:    Date
  country:      String
  province:     String
  city:         String
  email:        String
  schoolID:     ID
  hemaRatingsID: Int
}

input UpdatePersonInput {
  firstName:    String
  lastName:     String
  middleName:   String
  nickname:     String
  gender:       String
  birthdate:    Date
  country:      String
  province:     String
  city:         String
  email:        String
  schoolID:     ID
  hemaRatingsID: Int
}

input CreateSchoolInput {
  fullName:     String!
  shortName:    String
  abbreviation: String
  branch:       String
  city:         String
  province:     String
  countryIso2:  String
}

input UpdateSchoolInput {
  fullName:     String
  shortName:    String
  abbreviation: String
  branch:       String
  city:         String
  province:     String
  countryIso2:  String
}

input AttackInput {
  prefix: ID
  target: ID
  type:   ID
}

input CreateExchangeInput {
  matchID:       ID!
  exchangeType:  ExchangeType!
  scoringID:     ID
  receivingID:   ID
  scoreValue:    Float
  scoreDeduction: Float
  exchangeTime:  Int
  refPrefix:     ID
  refTarget:     ID
  refType:       ID
}

input UpdateExchangeInput {
  exchangeType:  ExchangeType
  scoringID:     ID
  receivingID:   ID
  scoreValue:    Float
  scoreDeduction: Float
  exchangeTime:  Int
  refPrefix:     ID
  refTarget:     ID
  refType:       ID
}

type Query {
  # People / Roster
  person(personID: ID!): Person
  people(schoolID: ID, lastName: String, firstName: String): [Person!]!

  # Events
  event(eventID: ID!): Event
  events(open: Boolean): [Event!]!

  # Tournaments
  tournament(tournamentID: ID!): Tournament
  tournaments(eventID: ID!): [Tournament!]!

  # Schools
  school(schoolID: ID!): School
  schools(country: String): [School!]!

  # Matches
  match(matchID: ID!): Match
  matches(tournamentID: ID, groupID: ID): [Match!]!
}

# ─── Person ──────────────────────────────────────────────────────────────────

type Person {
  personID: ID!
  firstName:      String!
  middleName:     String
  lastName:       String!
  nickname:       String
  gender:         String
  birthdate:      Date
  country:        String
  province:       String
  city:           String
  email:          String
  hemaRatingsID:  Int
  school:         School
  # Event-scoped entry; null when queried outside an event context
  eventEntry(eventID: ID!): EventRosterEntry
}

# Person as entered in a specific event
type EventRosterEntry {
  rosterID:        ID!
  personID:        ID!
  eventID:         ID!
  person:          Person!
  school:          School
  isTeam:          Boolean!
  checkedIn:       Boolean!
  waiverSigned:    Boolean!
  publicNotes:     String
  # Tournaments this person is entered in within the event
  tournamentEntries: [TournamentRosterEntry!]!
}

# Person as entered in a specific tournament
type TournamentRosterEntry {
  tournamentRosterID: ID!
  rosterID:           ID!
  tournamentID:       ID!
  rating:             Float
  checkedIn:          Boolean!
  gearChecked:        Boolean!
  person:             Person!
  tournament:         Tournament
}

# ─── School ───────────────────────────────────────────────────────────────────

type School {
  schoolID:      ID!
  fullName:      String!
  shortName:     String
  abbreviation:  String
  branch:        String
  city:          String
  province:      String
  country:       String
  members:       [Person!]!
}

# ─── Event ────────────────────────────────────────────────────────────────────

type Event {
  eventID:     ID!
  eventName:   String!
  isMetaEvent: Boolean!
  tournaments: [Tournament!]!
  roster:      [EventRosterEntry!]!
  startDate:   Date
  endDate:     Date
}

# ─── Tournament ───────────────────────────────────────────────────────────────

type Tournament {
  tournamentID:      ID!
  eventID:           ID!
  name:              String!
  weapon:            String
  prefix:            String
  gender:            String
  material:          String
  suffix:            String
  # Scoring rules
  maximumPoints:     Int
  maximumExchanges:  Int
  maxPointSpread:    Int
  maxDoubleHits:     Int
  timeLimit:         Int
  allowTies:         Boolean!
  isFinalized:       Boolean!
  isPrivate:         Boolean!
  isTeams:           Boolean!
  # Participants
  numParticipants:   Int!
  roster:            [TournamentRosterEntry!]!
  # Groups (pools and rounds)
  groups:            [Group!]!
  pools(groupSet: Int): [Pool!]!
  elims(groupSet: Int): [Elim!]!
  matches:           [Match!]!
}

# ─── Group (pool or round) ────────────────────────────────────────────────────

enum GroupType {
  pool
  round
  elim
  final
}

type Group {
  groupID:      ID!
  tournamentID: ID!
  groupType:    GroupType!
  groupName:    String!
  groupNumber:  Int!
  groupSet:     Int
  matches:      [Match!]!
  roster:       [TournamentRosterEntry!]!
}

# ─── Pool ─────────────────────────────────────────────────────────────────────

type Pool {
  groupID:      ID!
  tournamentID: ID!
  groupName:    String!
  groupNumber:  Int!
  groupSet:     Int!
  isComplete:   Boolean!
  numFighters:  Int
  locationID:   Int
  matches:      [Match!]!
  roster:       [TournamentRosterEntry!]!
  standings:    [PoolStanding!]!
}

type PoolStanding {
  standingID:    ID!
  rank:          Int
  person:        Person
  wins:          Float!
  losses:        Float!
  ties:          Float!
  matches:       Float!
  score:         Float!
  pointsFor:     Float!
  pointsAgainst: Float!
  doubles:       Float!
}

# ─── Elim ─────────────────────────────────────────────────────────────────────

type Elim {
  groupID:      ID!
  tournamentID: ID!
  groupName:    String!
  groupNumber:  Int!
  groupSet:     Int!
  isComplete:   Boolean!
  numFighters:  Int
  locationID:   Int
  matches:      [Match!]!
  roster:       [TournamentRosterEntry!]!
}

# ─── Match ────────────────────────────────────────────────────────────────────

type Match {
  matchID:        ID!
  groupID:        ID!
  tournamentID:   ID!
  matchNumber:    Int!
  fighter1:       TournamentRosterEntry
  fighter2:       TournamentRosterEntry
  winner:         TournamentRosterEntry
  fighter1Score:  Float
  fighter2Score:  Float
  matchTimeSeconds: Int
  isComplete:     Boolean!
  isIgnored:      Boolean!
  bracketPosition: Int
  bracketLevel:   Int
  exchanges:      [Exchange!]!
  result:         MatchResult
}

enum MatchResult {
  win
  tie
}

type Attack {
  prefix: String
  target: String
  type: String
}

enum IllegalAction {
  backOfHead
  excessiveForce
  offTarget
  unsportsmanlike 
  noHold
  weaponDisparity
  ringOut
  floor
  exposeBack
  unspecified
  score
  slow
  behavior_misc
  score_doubles
  target_foot
  control_misc
  target_action
  behavior_equip
  score_match_doubles
  behavior_contact
}

enum Card {
  yellow
  red
  black
}

enum ExchangeType {
  clean
  afterblow
  double
  doubleOut
  scored
  noExchange
  noQuality
  penalty
  tie
  winner
  switchFighter
}

# Individual scored exchange within a match
interface Exchange {
  exchangeID:     ID!
  match:          Match!
  exchangeNumber: Int!
  exchangeTime:   Int!
  score:          Int!
}

type Win implements Exchange {
  exchangeID:     ID!
  match:          Match!
  exchangeNumber: Int!
  exchangeTime:   Int!  
  score:          Int!
  winner:         TournamentRosterEntry!
}

type Tie implements Exchange {
  exchangeID:     ID!
  match:          Match!
  exchangeNumber: Int!
  exchangeTime:   Int!
  score:          Int!
}

type NoExchange implements Exchange {
  exchangeID:     ID!
  match:          Match!
  exchangeNumber: Int!
  exchangeTime:   Int!
  score:          Int!
}

type Clean implements Exchange {
  exchangeID:     ID!
  match:          Match!
  exchangeNumber: Int!
  exchangeTime:   Int!
  score:          Int!
  scorer:         TournamentRosterEntry
  receiver:       TournamentRosterEntry
  attack:         Attack
}

type Afterblow implements Exchange {
  exchangeID:     ID!
  match:          Match!
  exchangeNumber: Int!
  exchangeTime:   Int!
  score:          Int!
  scorer:         TournamentRosterEntry
  receiver:       TournamentRosterEntry
  attack:         Attack
}

type Double implements Exchange {
  exchangeID:     ID!
  match:          Match!
  exchangeNumber: Int!
  exchangeTime:   Int!
  score:          Int!
  fighter1Attack: Attack
  fighter2Attack: Attack
}

type DoubleOut implements Exchange {
  exchangeID:     ID!
  match:          Match!
  exchangeNumber: Int!
  exchangeTime:   Int!
  score:          Int!
  fighter1Attack: Attack
  fighter2Attack: Attack
}

# What is a "scored" exchange?
type Scored implements Exchange {
  exchangeID:     ID!
  match:          Match!
  exchangeNumber: Int!
  exchangeTime:   Int!
  score:          Int!
}

type NoQuality implements Exchange {
  exchangeID:     ID!
  match:          Match!
  exchangeNumber: Int!
  exchangeTime:   Int!  
  score:          Int!
}

type Penalty implements Exchange {
  exchangeID:     ID!
  match:          Match!
  exchangeNumber: Int!
  exchangeTime:   Int!
  recipient:      TournamentRosterEntry!
  score:          Int!
  illegalAction:  IllegalAction!
  card:           Card!
}

type SwitchFighter implements Exchange {
  exchangeID:     ID!
  match:          Match!
  exchangeNumber: Int!
  exchangeTime:   Int!
  score:          Int!
  incoming:       TournamentRosterEntry!
  outgoing:       TournamentRosterEntry!
}